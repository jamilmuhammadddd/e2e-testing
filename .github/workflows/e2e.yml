name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BASE_URL: ${{ vars.BASE_URL || 'http://localhost:3000' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Argos needs full history for accurate baseline comparison
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Resolve ticket scope
        id: scope
        run: node scripts/resolve-ticket-scope.js
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

      - name: Run E2E tests
        run: |
          if [ -n "${{ steps.scope.outputs.grep }}" ]; then
            echo "Running scoped tests for: ${{ steps.scope.outputs.grep }}"
            npx playwright test --grep "${{ steps.scope.outputs.grep }}"
          else
            echo "Running all tests"
            npx playwright test
          fi
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
